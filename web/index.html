<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WireLab Experiments</title><link rel="stylesheet" href="/style.css"><script defer src="/vendor/vue.global.prod.js"></script><script defer src="/app.js"></script></head>
<body><main id="app" v-cloak>
<header><div><small>NETWORK APPLIANCE</small><h1>WireLab Experiments</h1></div><span :class="['badge', metrics.running ? 'online' : '']">{{metrics.running ? 'Capturing' : 'Capture stopped'}}</span></header>
<section v-if="!connected" class="login"><h2>Connect to the appliance</h2><p>Enter the management token from your token file. It stays in this tab’s memory.</p><form @submit.prevent="connect"><input type="password" autocomplete="off" v-model="token" placeholder="Management token" required><button>Connect</button></form></section>
<p class="error" v-if="error" role="alert">{{error}}</p>
<template v-if="connected">
<div class="cards"><section><small>PACKETS OBSERVED</small><strong>{{metrics.packets || '0'}}</strong></section><section><small>CAPTURE BANDWIDTH</small><strong>{{rate(metrics.bits_per_second)}}</strong></section><section><small>METADATA DROPPED</small><strong>{{metrics.metadata_dropped || '0'}}</strong></section><section><small>NETWORK</small><strong>{{network.status || 'inactive'}}</strong></section></div>
<nav><button v-for="item in ['Monitor','Network','History']" :class="{selected: tab===item}" @click="tab=item">{{item}}</button><button @click="disconnect">Lock dashboard</button></nav>
<template v-if="tab==='Monitor'">
<section><h2>Live capture</h2><div class="controls"><select v-model="capture"><option disabled value="">Select Ethernet interface</option><option v-for="link in interfaces" :value="link.ifname">{{link.ifname}} · {{link.address}}</option></select><button @click="startCapture" :disabled="busy">Start capture</button><button @click="stopCapture" :disabled="busy">Stop</button></div><p>Capture one side of the appliance to avoid counting packets twice. Kernel packets dropped: {{metrics.kernel_dropped == null ? 'unknown' : metrics.kernel_dropped}}.</p><p class="error" v-if="metrics.capture_error">{{metrics.capture_error}}</p></section>
<section><h2>Traffic rate</h2><svg viewBox="0 0 800 120" role="img" aria-label="Recent capture bandwidth"><polyline :points="chart" fill="none" stroke="#60e0bb" stroke-width="3"/></svg></section>
<div class="columns"><section><h2>Protocol distribution</h2><div class="row" v-for="(count,name) in metrics.protocols"><span>{{name}}</span><b>{{count}}</b></div><p v-if="metrics.breakdown_complete===false">Breakdown is incomplete due to dropped metadata or talker limits.</p></section><section><h2>Top source addresses</h2><div class="row" v-for="talker in metrics.top_talkers"><span>{{talker.ip}}</span><b>{{talker.wire_bytes}} bytes</b></div></section></div>
<section><h2>Recent packets <small>Metadata only · last 200</small></h2><div class="scroll"><table><thead><tr><th>Source</th><th>Destination</th><th>Transport</th><th>Application hint</th><th>Bytes</th></tr></thead><tbody><tr v-for="(packet,index) in packets" :key="index"><td>{{packet.source_ip || 'non-IP'}}{{packet.source_port!==null ? ':'+packet.source_port : ''}}</td><td>{{packet.destination_ip}}{{packet.destination_port!==null ? ':'+packet.destination_port : ''}}</td><td>{{packet.protocol}}</td><td>{{packet.application}}</td><td>{{packet.wire_bytes}}</td></tr></tbody></table></div></section>
</template>
<section v-if="tab==='Network'"><h2>Identity translation</h2><p>Requires two dedicated unmanaged Ethernet ports without addresses or bridge membership. Configure the protected device to use the inner gateway below.</p><p>Network control: <b>{{network.enabled ? 'enabled' : 'disabled — start daemon with --allow-network'}}</b></p>
<form @submit.prevent="apply"><div class="form-grid"><label v-for="field in fields">{{field.label}}<input v-model="config[field.key]" :type="field.number ? 'number' : 'text'" required></label><label>VLAN ID (empty for untagged)<input v-model="vlan" type="number" min="1" max="4094"></label></div><div class="controls"><button type="button" @click="validateConfig" :disabled="busy">Validate</button><button :disabled="busy || !network.enabled || network.status!=='inactive'">Apply for 60 seconds</button></div></form>
<p v-if="validation">{{validation}}</p><p v-if="network.status==='awaiting_confirmation'">Confirm within {{network.remaining_seconds}} seconds to keep this configuration.</p><div class="controls"><button @click="confirm" v-if="network.status==='awaiting_confirmation'" :disabled="busy">Confirm configuration</button><button @click="rollback" v-if="network.status!=='inactive'" :disabled="busy">Rollback / deactivate</button></div><p class="error" v-if="network.error">{{network.error}}</p>
</section>
<section v-if="tab==='History'"><h2>Historical bandwidth</h2><div class="controls"><select v-model="interval"><option value="60">1 minute</option><option value="300">5 minutes</option><option value="3600">1 hour</option></select><button @click="loadHistory">Load last 24 hours</button></div><p>Retained for seven days. Buckets sum observed packets and bytes; downtime is not zero traffic.</p><div class="scroll"><table><thead><tr><th>Bucket start</th><th>Packets</th><th>Bytes</th><th>Recorded samples</th></tr></thead><tbody><tr v-for="row in history"><td>{{new Date(row.timestamp*1000).toLocaleString()}}</td><td>{{row.packets}}</td><td>{{row.wire_bytes}}</td><td>{{row.samples}}</td></tr></tbody></table></div><h2>Recent connections</h2><div class="scroll"><table><thead><tr><th>Source</th><th>Destination</th><th>Protocol</th><th>Packets</th><th>Bytes</th></tr></thead><tbody><tr v-for="flow in flows"><td>{{flow.source_ip}}:{{flow.source_port}}</td><td>{{flow.destination_ip}}:{{flow.destination_port}}</td><td>{{flow.protocol}}</td><td>{{flow.packets}}</td><td>{{flow.bytes}}</td></tr></tbody></table></div></section>
</template><footer>WireLab Experiments 0.2 · Routed IPv4 · No payload retention</footer>
</main></body></html>
